[package]
name = "kmutnb-phylab-plotter"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Terminal graph-paper plotter for physics lab data"

[dependencies]
anyhow = "1.0"
csv = "1.3"
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }

[dev-dependencies]
tempfile = "3.10"
